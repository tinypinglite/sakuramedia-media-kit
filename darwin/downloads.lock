# All upstream tarballs are re-hosted on this project's own
# "deps-mirror-v1" GitHub Release — see the top-level README for the why.
# Short version: over the course of one afternoon, SourceForge 403'd,
# freedesktop.org 418'd, Savannah 502'd, ffmpeg.org TLS-timeouted, and
# code.videolan.org's gitlab archive SHA drifted. Not one upstream mirror
# held up; every one of them broke a build. Now we control the whole set.
#
# All 15 tarballs were verified against upstream SHA256 locally before
# uploading to the mirror release. To refresh the mirror (e.g. bump a dep):
#   1. Download the new upstream tarball, verify its SHA.
#   2. Upload to a NEW mirror release (deps-mirror-v2, don't overwrite v1).
#   3. Update the URL(s) and sha256(s) below and re-tag darwin-v*.
#
# libx264 is intentionally not mirrored — only the "encodersgpl" flavor
# depends on it, and we only build "video-default".

